name: Artifact Preview

"on":
  workflow_dispatch:
    inputs:
      integration_contract_url:
        description: Public HTTPS URL of the reviewed integration contract attachment
        required: true
        type: string
      integration_contract_sha256:
        description: Reviewed SHA-256 of the unchanged attachment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: artifact-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_AW_ROUTER_TEST_IMAGE: gh-aw-router-preview:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run --locked python -m pytest
      - name: Build the normal Linux amd64 image
        run: >-
          docker build --platform linux/amd64
          --build-arg VCS_REF="$GITHUB_SHA"
          --tag "$GH_AW_ROUTER_TEST_IMAGE" .
      - run: uv run --locked python -m pytest --run-docker -m docker
      - name: Fetch the supplied attachment
        env:
          CONTRACT_URL: ${{ inputs.integration_contract_url }}
        run: >-
          curl --proto '=https' --proto-redir '=https'
          --fail --silent --show-error --location
          --max-time 30 --max-filesize 1048576
          --output "$RUNNER_TEMP/integration-contract.md" "$CONTRACT_URL"
      - name: Export and verify the development archive
        env:
          CONTRACT_SHA256: ${{ inputs.integration_contract_sha256 }}
        run: |
          uv run --locked python tests/contract_corpus.py \
            --integration-contract "$RUNNER_TEMP/integration-contract.md" \
            --integration-contract-sha256 "$CONTRACT_SHA256" \
            --development --output dist/preview/routing-contract.tar.gz
          uv run --locked python tests/contract_corpus.py \
            --integration-contract "$RUNNER_TEMP/integration-contract.md" \
            --integration-contract-sha256 "$CONTRACT_SHA256" \
            --development --output dist/repeated-contract.tar.gz
          cmp dist/preview/routing-contract.tar.gz dist/repeated-contract.tar.gz
      - name: Save the tested local image and checksums
        run: |
          docker image save "$GH_AW_ROUTER_TEST_IMAGE" --output dist/preview/router-image.tar
          docker image inspect "$GH_AW_ROUTER_TEST_IMAGE" > dist/preview/image-inspect.json
          cd dist/preview
          sha256sum routing-contract.tar.gz router-image.tar image-inspect.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: router-preview-${{ github.sha }}
          path: dist/preview/
          if-no-files-found: error
          retention-days: 7